<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transportation Form</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/css/tom-select.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <link rel="stylesheet" href="style.css">
</head>

<body class="bg-gray-100 p-4 min-h-screen">

  <div class="max-w-xl mx-auto bg-white p-6 rounded-lg shadow-lg">
    <h2 class="text-2xl font-bold mb-6 text-center text-blue-700">บันทึกข้อมูลการขนส่ง</h2>

    <form id="transportForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700">RS AREA</label>
        <select id="area" placeholder="เลือกหรือค้นหาพื้นที่..." autocomplete="off"></select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Sender / ผู้ส่ง</label>
        <input type="text" id="sender" class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none"
          required>
      </div>
      <div class="flex items-center mt-1">
        <input type="checkbox" id="rememberMe" class="h-4 w-4 text-blue-600 border-gray-300 rounded" checked>
        <label for="rememberMe" class="ml-2 text-xs text-gray-500">จดจำชื่อผู้ส่งในเครื่องนี้</label>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Picture / แนบรูปภาพส่งของ</label>
        <input type="file" id="imageItems" accept="image/*" class="w-full p-1 text-sm border rounded mt-1 bg-gray-50">
        <div id="previewItems" class="mt-2 hidden"><img src="" class="h-32 rounded border"></div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Picture / แนบรูปเอกสารใบส่งของ</label>
        <input type="file" id="imageDoc" accept="image/*" class="w-full p-1 text-sm border rounded mt-1 bg-gray-50">
        <div id="previewDoc" class="mt-2 hidden"><img src="" class="h-32 rounded border"></div>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700">Remark / หมายเหตุเพิ่มเติม</label>
        <textarea id="remark" rows="3"
          class="w-full p-2 border rounded focus:ring-2 focus:ring-blue-500 outline-none"></textarea>
      </div>

      <button type="button" onclick="confirmSubmit()"
        class="w-full bg-blue-600 text-white py-3 rounded-lg font-bold hover:bg-blue-700 transition shadow-md">
        ส่งข้อมูล
      </button>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/tom-select@2.2.2/dist/js/tom-select.complete.min.js"></script>
  <script src="script.js"></script>
</body>

</html>
